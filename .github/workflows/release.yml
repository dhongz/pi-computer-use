name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build universal binary & publish release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show Swift version
        run: swift --version

      - name: Build universal release binary (arm64 + x86_64)
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN_PATH=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          mkdir -p dist
          cp "$BIN_PATH/pi-computer-use" dist/pi-computer-use
          file dist/pi-computer-use

      - name: Package tarball
        id: package
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: bash scripts/package-release.sh "$RELEASE_TAG" dist/pi-computer-use dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}
